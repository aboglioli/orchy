[workspace]
resolver = "3"
members = [
    "crates/orchy-core",
    "crates/orchy-application",
    "crates/orchy-store-memory",
    "crates/orchy-store-vault",
    "crates/orchy-cli",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/aboglioli/orchy"

[workspace.dependencies]
# Event toolkit. Pinned by tag until eventuary reaches crates.io; a path dependency
# resolved outside the repository, which cannot be checked out by CI.
# The facade is the only entry point: backends come from it by feature, never as
# separate crates, so every import in the workspace reads `use eventuary::`.
eventuary = { git = "https://github.com/aboglioli/eventuary", tag = "v0.3.0-rc.3", features = [
    "fs",
    "memory",
] }

# Domain
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }

# Async
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }

# Vault storage
fs4 = "0.13"
grep-matcher = "0.1"
grep-regex = "0.1"
regex-syntax = "0.8"
grep-searcher = "0.1"
ignore = "0.4"
serde-saphyr = "1.3"
toml = "0.9"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"

# Testing
tempfile = "3"

# Internal
orchy-core = { path = "crates/orchy-core" }
orchy-application = { path = "crates/orchy-application" }
orchy-store-memory = { path = "crates/orchy-store-memory" }
orchy-store-vault = { path = "crates/orchy-store-vault" }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
redundant_closure = "warn"
collapsible_if = "warn"
needless_collect = "warn"
str_to_string = "warn"
await_holding_lock = "warn"
clone_on_ref_ptr = "warn"
