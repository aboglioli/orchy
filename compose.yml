services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: orchy
      POSTGRES_PASSWORD: orchy
      POSTGRES_DB: orchy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchy"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    ports:
      - "3100:3100"
    volumes:
      - ./config.docker.toml:/app/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
