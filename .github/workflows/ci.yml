name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install rdkafka build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config \
            libsasl2-dev libssl-dev libcurl4-openssl-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install rdkafka build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config \
            libsasl2-dev libssl-dev libcurl4-openssl-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast

  integration:
    name: integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install rdkafka build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config \
            libsasl2-dev libssl-dev libcurl4-openssl-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p orchy-store-pg --features integration-tests -- --test-threads=1
      - run: cargo test -p orchy-store-conformance --features integration-tests -- --test-threads=1
      - run: cargo test -p orchy-events-sqs --features integration-tests -- --test-threads=1
      - run: cargo test -p orchy-events-kafka --features integration-tests -- --test-threads=1
